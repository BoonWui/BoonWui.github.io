name: Refresh Bursa prices hourly

on:
  schedule:
    - cron: "5 1-9 * * 1-5"   # 09:05 to 17:05 Malaysia time, every hour, Monday to Friday
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bursa-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_bursa_live.py
      - name: Commit if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bursa-monitor/live.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Refresh Bursa live prices"
          git pull --rebase
          git push
