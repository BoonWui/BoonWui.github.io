name: Refresh Bursa prices (3 snapshots a day)

on:
  schedule:
    - cron: "35 2,4,7 * * 1-5"   # 10:35, 12:35 and 15:35 Malaysia time, Monday to Friday (few requests, to go easy on Yahoo)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bursa-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_bursa_live.py
      - name: Commit if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bursa-monitor/live.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Refresh Bursa live prices"
          git pull --rebase
          git push
