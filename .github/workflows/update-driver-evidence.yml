name: Re-test FCPO driver weights

# Monthly check of the FCPO Driver Tree weights against the latest prices and MPOB data.
on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of every month, 10:00 Malaysia time
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python scripts/driver_evidence.py
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/fcpo_driver_evidence.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fcpo_driver_evidence.json
          git commit -m "FCPO driver weights re-test $(date -u +%F)"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
