name: Fetch MPOB monthly figures

on:
  schedule:
    # MPOB releases about 12:30 Malaysia time on or after the 10th. GitHub sometimes skips scheduled runs,
    # so try four times a day (13:15, 14:15, 16:15, 19:15 MYT); once the month is in, later runs do nothing.
    - cron: "15 5,6,8,11 10-16 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - name: Fetch the latest MPOB release
        run: python scripts/fetch_mpob.py
      - name: Rebuild the palm monitor if the figures changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/mpob_malaysia.csv; then
            echo "No new MPOB month."
            exit 0
          fi
          python scripts/update_palm_monitor.py
          python scripts/nowcast.py   # freeze next month's forecast before MPOB publishes it
          python scripts/write_market_note.py   # this month's palm market note (written once)
          python scripts/build_feed.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mpob_malaysia.csv data/mpob_nowcast_log.json market-notes feed.xml sitemap.xml palm-oil-monitor/data.json palm-oil-monitor/archive
          git commit -m "Add MPOB $(tail -1 data/mpob_malaysia.csv | cut -d, -f1) figures"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
