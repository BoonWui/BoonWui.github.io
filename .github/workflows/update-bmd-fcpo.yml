name: Fetch BMD FCPO prices

# Bursa Malaysia Derivatives closes at 18:00 Malaysia time.
on:
  schedule:
    - cron: "50 10,14 * * 1-5"   # 18:50 and 22:50 Malaysia time, Monday to Friday
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests yfinance pandas
      - run: python scripts/fetch_fcpo.py
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/bmd_fcpo.json; then
            echo "No new FCPO day."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bmd_fcpo.json
          git commit -m "BMD FCPO prices $(date -u +%F)"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
