name: Data health check

# Fails (and GitHub emails the owner) when a data feed is stale or a job keeps failing.
on:
  schedule:
    - cron: "0 1 * * *"   # 09:00 Malaysia time, daily
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/check_health.py
        env:
          GH_TOKEN: ${{ github.token }}
