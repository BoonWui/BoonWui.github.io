name: Update S&P 500 monitor

on:
  schedule:
    - cron: "45 15,18 * * 1-5"   # two snapshots in US trading hours (10:45 and 13:45 New York in winter, 11:45 and 14:45 in summer)
    - cron: "30 22 * * 1-5"      # full history after the US close
  workflow_dispatch:
    inputs:
      mode:
        description: "live (latest prices) or full (rebuild history)"
        default: "full"

permissions:
  contents: write

concurrency:
  group: sp500-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Rebuild history (after the close, or when run by hand)
        if: github.event.schedule == '30 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'live')
        run: python scripts/update_sp500_monitor.py
      - name: Refresh latest prices
        run: python scripts/update_bursa_live.py sp500-monitor
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sp500-monitor/data.json sp500-monitor/live.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update S&P 500 monitor data"
          git pull --rebase
          git push
