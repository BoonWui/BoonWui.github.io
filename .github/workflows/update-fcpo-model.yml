name: Refit the FCPO model weekly

# Weekly refit and walk-forward score of the FCPO model, after the Friday CFTC release.
on:
  schedule:
    - cron: "30 3 * * 6"   # Saturday 11:30 Malaysia time
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python scripts/fcpo_model.py
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/fcpo_model.json data/model_inputs.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fcpo_model.json data/model_inputs.json
          git commit -m "FCPO model refit $(date -u +%F)"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
