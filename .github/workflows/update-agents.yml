name: Refresh trading-agent demos (Quorvia, Kestrel, Merlin)

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 19:30 Malaysia time, after the Bursa close (Monday to Friday)
    - cron: "30 22 * * 1-5"   # 06:30 Malaysia time next morning, after the US close (covers Friday's US session on Saturday morning)
  push:
    branches: [main]
    paths: ["data/fcpo_daily.json"]   # the owner's evening job adds the day's FCPO close here
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agents-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_agents.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-brokerage/anchors.json rl-trader/index.html merlin-nasdaq/index.html agents/merlin_universe.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Daily refresh: Quorvia, Kestrel, Merlin"
          git pull --rebase
          git push
