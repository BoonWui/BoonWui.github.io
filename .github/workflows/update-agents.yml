name: Refresh trading-agent demos (Quorvia, Kestrel, Merlin)

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 19:30 Malaysia time, after the Bursa close (Monday to Friday)
    - cron: "30 22 * * 1-5"   # 06:30 Malaysia time next morning, after the US close (covers Friday's US session on Saturday morning)
  push:
    branches: [main]
    paths: ["data/fcpo_daily.json"]   # the owner's evening job adds the day's FCPO close here
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agents-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Build on the latest main and push (rebuilds from scratch if another commit lands first)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/update_agents.py
            git add ai-brokerage/anchors.json rl-trader/index.html merlin-nasdaq/index.html agents/merlin_universe.json
            if git diff --cached --quiet; then echo "No change."; exit 0; fi
            git commit -q -m "Daily refresh: Quorvia, Kestrel, Merlin"
            if git push -q origin HEAD:main; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Someone else pushed first; rebuilding on top of it."
            sleep 15
          done
          exit 1
