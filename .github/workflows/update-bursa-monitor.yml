name: Update Bursa monitor (full history)

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 18:30 Malaysia time, after Bursa closes, Monday to Friday
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: bursa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_bursa_monitor.py
      - name: Commit if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bursa-monitor/data.json
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "Update Bursa monitor data"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
