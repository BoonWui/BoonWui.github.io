name: Update weather and energy monitors

on:
  schedule:
    - cron: "15 23 * * *"   # 07:15 Malaysia time, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: commodity-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pandas xlrd
      - name: Weather (Open-Meteo)
        run: python scripts/update_weather.py
        continue-on-error: true
      - name: Energy and ringgit (EIA, Bank Negara Malaysia)
        run: python scripts/update_energy.py
        continue-on-error: true
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-monitor/data.json energy-monitor/data.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update weather and energy data"
          git pull --rebase
          git push
