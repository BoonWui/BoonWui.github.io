name: Tests

on:
  push:
    paths: ["scripts/**", "tests/**", "data/**", "palm-oil-monitor/data.json", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests pytest
      - run: pytest -q
